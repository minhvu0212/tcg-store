<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="35%" stop-color="#D9B45B" />
      <stop offset="100%" stop-color="#997524" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A277EF" />
      <stop offset="50%" stop-color="#8957E5" />
      <stop offset="100%" stop-color="#438DFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card 1 (Back rotated) -->
  <rect x="22" y="14" width="34" height="48" rx="4" transform="rotate(-15 22 14)" fill="#111522" stroke="url(#purpleGrad)" stroke-width="2" opacity="0.85"/>
  
  <!-- Card 2 (Front) -->
  <g filter="url(#glow)">
    <rect x="26" y="16" width="34" height="48" rx="4" transform="rotate(8 26 16)" fill="#171C2B" stroke="url(#goldGrad)" stroke-width="2.2"/>
    <!-- Holographic Star in front card -->
    <path d="M46 36 L48 42 L54 44 L48 46 L46 52 L44 46 L38 44 L44 42 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography: TCG STORE -->
  <text x="82" y="44" font-family="'Cinzel', 'Outfit', sans-serif" font-weight="900" font-size="28" letter-spacing="4" fill="url(#goldGrad)">TCG</text>
  <text x="175" y="44" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="28" letter-spacing="3" fill="#F5F5F7">STORE</text>
  
  <!-- Slogan -->
  <text x="84" y="60" font-family="'Inter', sans-serif" font-weight="600" font-size="9" letter-spacing="3" fill="#9CA3B5">YOUR COLLECTION • YOUR LEGEND</text>
</svg>
